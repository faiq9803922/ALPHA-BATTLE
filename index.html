<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esports Tournaments</title>
    <style>
        /* Mobile-First Base Styling */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            padding-bottom: 80px; 
            -webkit-tap-highlight-color: transparent;
        }
        h2 { text-align: center; color: #ffeb3b; margin-top: 15px; font-size: 20px; text-transform: uppercase; }
        
        /* Views */
        .view { display: none; padding: 15px; max-width: 500px; margin: 0 auto; }
        .view.active { display: block; }

        /* Cards & Inputs */
        .card { 
            background: #1e1e1e; 
            padding: 16px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
            border-left: 5px solid #ff4757; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        .card p { margin: 8px 0; color: #cccccc; font-size: 15px; word-break: break-word; }
        .card strong { color: #ffffff; }
        
        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .badge-main { background-color: #ff4757; color: #fff; }
        .badge-2nd { background-color: #2ed573; color: #000; }
        
        label { display: block; margin-top: 10px; font-size: 14px; color: #aaa; font-weight: 600; }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 6px 0 12px 0; 
            border: 1px solid #333; 
            border-radius: 8px; 
            background: #2a2a2a; 
            color: white; 
            font-size: 16px; /* Prevents auto-zoom on iOS */
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff4757; }
        textarea { resize: vertical; min-height: 70px; }
        
        /* Buttons */
        button { 
            width: 100%; 
            padding: 14px; 
            background: #ff4757; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-top: 5px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.98); }
        
        /* ID & Pass Display Container */
        .idp-box {
            background: #141414;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #2a2a2a;
        }
        .idp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }
        .idp-row:last-child { margin-bottom: 0; }
        .idp-text { font-size: 14px; word-break: break-all; }
        
        .copy-btn { 
            width: auto; 
            padding: 8px 14px; 
            font-size: 13px; 
            background: #2e86de; 
            margin-top: 0;
            white-space: nowrap;
        }
        .copy-btn:hover { background: #1b6ca8; }
        
        .save-btn { background: #2ed573; color: #000; }
        .save-btn:hover { background: #26af5f; }

        .delete-btn { background: #ff4757; margin-top: 10px; }

        /* Bottom Navigation */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background: #1a1a1a; 
            display: flex; 
            border-top: 1px solid #333; 
            z-index: 100; 
        }
        .nav-item { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            cursor: pointer; 
            color: #888; 
            font-size: 14px;
            transition: 0.2s; 
        }
        .nav-item.active { color: #ff4757; background: #252525; border-top: 3px solid #ff4757; }
        
        #status-msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
        hr { border: 0; height: 1px; background: #333; margin: 25px 0; }
    </style>
</head>
<body>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <h2>LATEST MATCHES</h2>
        <div id="matches-container">
            <p style="text-align: center; color: #888;">Loading matches...</p>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="view">
        <!-- Login Section -->
        <div id="admin-login-section">
            <h2>ADMIN LOGIN</h2>
            <div class="card">
                <input type="password" id="admin-pass" placeholder="Enter Admin Password">
                <button id="login-btn">Login</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="admin-dashboard-section" style="display: none;">
            <h2>PUBLISH NEW MATCH</h2>
            <div class="card">
                <label>Tournament Name:</label>
                <input type="text" id="match-tournament" placeholder="e.g. Free Fire Battle Royale">

                <label>Select Lineup:</label>
                <select id="match-lineup">
                    <option value="MAIN LINEUP">MAIN LINEUP</option>
                    <option value="2ND LINEUP">2ND LINEUP</option>
                </select>

                <label>Description:</label>
                <textarea id="match-description" placeholder="e.g. Map: Bermuda, Rules: No teaming"></textarea>
                
                <label>Match Time:</label>
                <input type="text" id="match-time" placeholder="e.g. 9:00 PM">
                
                <button id="publish-btn">Publish Match</button>
                <p id="status-msg"></p>
            </div>

            <hr>

            <h2>MANAGE MATCHES & ROOM DETAILS</h2>
            <p style="text-align: center; color: #888; font-size: 13px;">Add Room ID & Password or delete matches below.</p>
            <div id="admin-matches-container">
                <!-- Admin matches load here -->
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home">HOME</div>
        <div class="nav-item" id="nav-admin">ADMIN</div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyACC6nAbAb96Aw5NAe-C2aTZ8-gtOsnYzE",
            authDomain: "survivors-b9c6d.firebaseapp.com",
            projectId: "survivors-b9c6d",
            storageBucket: "survivors-b9c6d.firebasestorage.app",
            messagingSenderId: "289481978081",
            appId: "1:289481978081:web:68e424068ff9d056d607a0",
            measurementId: "G-1XRC9SCV59"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // UI Elements
        const homeView = document.getElementById('home-view');
        const adminView = document.getElementById('admin-view');
        const navHome = document.getElementById('nav-home');
        const navAdmin = document.getElementById('nav-admin');
        const matchesContainer = document.getElementById('matches-container');
        const adminMatchesContainer = document.getElementById('admin-matches-container');

        let isAdminLoggedIn = false;

        // Navigation Switcher
        navHome.addEventListener('click', () => {
            homeView.classList.add('active');
            adminView.classList.remove('active');
            navHome.classList.add('active');
            navAdmin.classList.remove('active');
            fetchMatches();
        });

        navAdmin.addEventListener('click', () => {
            adminView.classList.add('active');
            homeView.classList.remove('active');
            navAdmin.classList.add('active');
            navHome.classList.remove('active');
            if (isAdminLoggedIn) {
                fetchAdminMatches();
            }
        });

        // Admin Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "srv1122") { 
                isAdminLoggedIn = true;
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-dashboard-section').style.display = 'block';
                fetchAdminMatches();
            } else {
                alert("Incorrect Password!");
            }
        });

        // Publish Match
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const tournament = document.getElementById('match-tournament').value.trim();
            const lineup = document.getElementById('match-lineup').value;
            const description = document.getElementById('match-description').value.trim();
            const time = document.getElementById('match-time').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!tournament || !time) {
                statusMsg.textContent = "Please fill in Tournament Name and Time.";
                statusMsg.style.color = "#ff4757";
                return;
            }

            statusMsg.textContent = "Publishing...";
            statusMsg.style.color = "#ffeb3b";

            try {
                await addDoc(collection(db, "matches"), {
                    tournament: tournament,
                    lineup: lineup,
                    description: description || "No description provided.",
                    time: time,
                    roomId: "", 
                    roomPass: "",
                    createdAt: serverTimestamp()
                });
                
                statusMsg.textContent = "Match Published Successfully!";
                statusMsg.style.color = "#2ed573";
                
                document.getElementById('match-tournament').value = '';
                document.getElementById('match-description').value = '';
                document.getElementById('match-time').value = '';

                fetchAdminMatches();
                setTimeout(() => statusMsg.textContent = "", 3000);
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMsg.textContent = "Error publishing match.";
                statusMsg.style.color = "#ff4757";
            }
        });

        // Helper for Clipboard Copying
        window.copyToClipboard = function(text, btnElement) {
            if (!text) {
                alert("Nothing to copy!");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.textContent;
                btnElement.textContent = "Copied!";
                btnElement.style.background = "#2ed573";
                btnElement.style.color = "#000";
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.style.background = "#2e86de";
                    btnElement.style.color = "#fff";
                }, 1500);
            }).catch(err => {
                console.error('Copy failed', err);
            });
        };

        // Fetch Matches for Home View
        async function fetchMatches() {
            matchesContainer.innerHTML = '<p style="text-align: center; color: #888;">Loading matches...</p>';
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                matchesContainer.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    matchesContainer.innerHTML = '<p style="text-align: center; color: #888;">No matches published yet.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const badgeClass = data.lineup === 'MAIN LINEUP' ? 'badge-main' : 'badge-2nd';
                    
                    const hasRoomDetails = (data.roomId && data.roomId.trim() !== "") || (data.roomPass && data.roomPass.trim() !== "");

                    let roomSectionHtml = '';
                    if (hasRoomDetails) {
                        roomSectionHtml = `
                            <div class="idp-box">
                                <div class="idp-row">
                                    <span class="idp-text"><strong>Room ID:</strong> ${data.roomId || 'N/A'}</span>
                                    ${data.roomId ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomId}', this)">Copy ID</button>` : ''}
                                </div>
                                <div class="idp-row">
                                    <span class="idp-text"><strong>Pass:</strong> ${data.roomPass || 'N/A'}</span>
                                    ${data.roomPass ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomPass}', this)">Copy Pass</button>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        roomSectionHtml = `
                            <div class="idp-box" style="text-align: center; color: #ffeb3b; font-size: 13px;">
                                Room ID & Password will be available here soon.
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <span class="badge ${badgeClass}">${data.lineup || 'MAIN LINEUP'}</span>
                        <p style="font-size: 18px; font-weight: bold; color: #fff;">${data.tournament || 'Tournament'}</p>
                        <p><strong>Time:</strong> ${data.time}</p>
                        <p><strong>Description:</strong> ${data.description}</p>
                        ${roomSectionHtml}
                    `;
                    
                    matchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching matches: ", error);
                matchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757;">Failed to load matches.</p>';
            }
        }

        // Fetch Matches for Admin Dashboard
        async function fetchAdminMatches() {
            adminMatchesContainer.innerHTML = '<p style="text-align: center; color: #888;">Loading matches...</p>';
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminMatchesContainer.innerHTML = '';
                
                if (querySnapshot.empty) {
                    adminMatchesContainer.innerHTML = '<p style="text-align: center; color: #888;">No matches found.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <p style="font-size: 16px; font-weight: bold; color: #ffeb3b;">${data.tournament || 'N/A'} (${data.lineup || 'MAIN LINEUP'})</p>
                        <p><strong>Time:</strong> ${data.time}</p>
                        <p><strong>Description:</strong> ${data.description}</p>
                        
                        <label>Room ID:</label>
                        <input type="text" id="room-id-${docSnap.id}" placeholder="Enter Room ID" value="${data.roomId || ''}">
                        
                        <label>Room Password:</label>
                        <input type="text" id="room-pass-${docSnap.id}" placeholder="Enter Password" value="${data.roomPass || ''}">
                    `;
                    
                    const updateBtn = document.createElement('button');
                    updateBtn.className = 'save-btn';
                    updateBtn.textContent = 'Save Details';
                    
                    updateBtn.addEventListener('click', async () => {
                        const newRoomId = document.getElementById(`room-id-${docSnap.id}`).value.trim();
                        const newRoomPass = document.getElementById(`room-pass-${docSnap.id}`).value.trim();
                        
                        updateBtn.textContent = 'Saving...';
                        
                        try {
                            const matchRef = doc(db, "matches", docSnap.id);
                            await updateDoc(matchRef, {
                                roomId: newRoomId,
                                roomPass: newRoomPass
                            });
                            updateBtn.textContent = 'Saved!';
                            setTimeout(() => { updateBtn.textContent = 'Save Details'; }, 2000);
                        } catch (error) {
                            console.error("Error updating details:", error);
                            updateBtn.textContent = 'Error!';
                            updateBtn.style.background = '#ff4757';
                        }
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete Match';

                    deleteBtn.addEventListener('click', async () => {
                        if (confirm("Are you sure you want to delete this match?")) {
                            deleteBtn.textContent = 'Deleting...';
                            try {
                                const matchRef = doc(db, "matches", docSnap.id);
                                await deleteDoc(matchRef);
                                fetchAdminMatches();
                            } catch (error) {
                                console.error("Error deleting match:", error);
                                deleteBtn.textContent = 'Error Deleting';
                            }
                        }
                    });

                    card.appendChild(updateBtn);
                    card.appendChild(deleteBtn);
                    adminMatchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching admin matches:", error);
                adminMatchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757;">Failed to load.</p>';
            }
        }

        // Initial Load
        fetchMatches();
    </script>
</body>
</html>
