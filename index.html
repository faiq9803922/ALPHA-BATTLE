<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Tournaments</title>
    <style>
        /* Base Styling */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding-bottom: 70px; }
        h2 { text-align: center; color: #ffeb3b; }
        
        /* Views */
        .view { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .view.active { display: block; }

        /* Cards & Inputs */
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #ff4757; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card p { margin: 8px 0; color: #cccccc; }
        .card strong { color: #ffffff; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #333; border-radius: 6px; background: #2a2a2a; color: white; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: none; border-color: #ff4757; }
        
        button { width: 100%; padding: 12px; background: #ff4757; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        button:hover { background: #ff2a3d; }
        
        .idp-btn { background: #ffeb3b; color: #000; }
        .idp-btn:hover { background: #ffd600; }
        
        .save-btn { background: #4cd137; }
        .save-btn:hover { background: #44bd32; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1a1a1a; display: flex; border-top: 1px solid #333; z-index: 100; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; color: #888; transition: 0.3s; }
        .nav-item.active { color: #ff4757; background: #252525; border-bottom: 4px solid #ff4757; }
        
        #status-msg { text-align: center; margin-top: 10px; font-weight: bold; }
        hr { border: 0; height: 1px; background: #333; margin: 30px 0; }
    </style>
</head>
<body>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <h2>LATEST MATCHES</h2>
        <div id="matches-container">
            <p style="text-align: center;">Loading matches...</p>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="view">
        <!-- Login Section -->
        <div id="admin-login-section">
            <h2>ADMIN LOGIN</h2>
            <div class="card">
                <input type="password" id="admin-pass" placeholder="Enter Admin Password">
                <button id="login-btn">Login</button>
            </div>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="admin-dashboard-section" style="display: none;">
            <h2>PUBLISH NEW MATCH</h2>
            <div class="card">
                <label>Match Date (Write anything):</label>
                <input type="text" id="match-date" placeholder="e.g. Sunday 12th Nov">
                
                <label>Match Time (Write anything):</label>
                <input type="text" id="match-time" placeholder="e.g. 9:00 PM">
                
                <button id="publish-btn">Publish Match</button>
                <p id="status-msg"></p>
            </div>

            <hr>

            <h2>UPDATE MATCH IDP</h2>
            <p style="text-align: center; color: #888; font-size: 14px;">Add or change IDP for published matches below.</p>
            <div id="admin-matches-container">
                <!-- Admin matches for adding IDP will load here -->
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home">HOME</div>
        <div class="nav-item" id="nav-admin">ADMIN</div>
    </div>

    <!-- Firebase SDK Setup as Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        // Added doc and updateDoc to allow updating the IDP later
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyACC6nAbAb96Aw5NAe-C2aTZ8-gtOsnYzE",
            authDomain: "survivors-b9c6d.firebaseapp.com",
            projectId: "survivors-b9c6d",
            storageBucket: "survivors-b9c6d.firebasestorage.app",
            messagingSenderId: "289481978081",
            appId: "1:289481978081:web:68e424068ff9d056d607a0",
            measurementId: "G-1XRC9SCV59"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const homeView = document.getElementById('home-view');
        const adminView = document.getElementById('admin-view');
        const navHome = document.getElementById('nav-home');
        const navAdmin = document.getElementById('nav-admin');
        const matchesContainer = document.getElementById('matches-container');
        const adminMatchesContainer = document.getElementById('admin-matches-container');

        let isAdminLoggedIn = false;

        // Tab Switching Logic
        navHome.addEventListener('click', () => {
            homeView.classList.add('active');
            adminView.classList.remove('active');
            navHome.classList.add('active');
            navAdmin.classList.remove('active');
            fetchMatches(); // Refresh home matches
        });

        navAdmin.addEventListener('click', () => {
            adminView.classList.add('active');
            homeView.classList.remove('active');
            navAdmin.classList.add('active');
            navHome.classList.remove('active');
            if (isAdminLoggedIn) {
                fetchAdminMatches(); // Refresh admin list if already logged in
            }
        });

        // Admin Login Logic
        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            // Updated Password Requirement
            if (pass === "srv1122") { 
                isAdminLoggedIn = true;
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-dashboard-section').style.display = 'block';
                fetchAdminMatches(); // Load matches so admin can add IDP
            } else {
                alert("Incorrect Password!");
            }
        });

        // Publish Match Logic (Creates match WITHOUT IDP initially)
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const date = document.getElementById('match-date').value;
            const time = document.getElementById('match-time').value;
            const statusMsg = document.getElementById('status-msg');

            if (!date || !time) {
                statusMsg.textContent = "Please fill in date and time.";
                statusMsg.style.color = "#ff4757";
                return;
            }

            statusMsg.textContent = "Publishing...";
            statusMsg.style.color = "#ffeb3b";

            try {
                // Add to Firestore database (IDP is blank at start)
                await addDoc(collection(db, "matches"), {
                    date: date,
                    time: time,
                    idp: "", // Empty until admin updates it
                    createdAt: serverTimestamp()
                });
                
                statusMsg.textContent = "Match Published Successfully!";
                statusMsg.style.color = "#4cd137";
                
                // Clear inputs
                document.getElementById('match-date').value = '';
                document.getElementById('match-time').value = '';

                // Refresh the admin match list so the new match appears at the top
                fetchAdminMatches();
                
                // Clear success message after 3 seconds
                setTimeout(() => statusMsg.textContent = "", 3000);
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMsg.textContent = "Error publishing match. Check console.";
                statusMsg.style.color = "#ff4757";
            }
        });

        // Fetch Matches for Home Screen
        async function fetchMatches() {
            matchesContainer.innerHTML = '<p style="text-align: center;">Loading matches...</p>';
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                matchesContainer.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    matchesContainer.innerHTML = '<p style="text-align: center;">No matches published yet.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <p><strong>Date:</strong> ${data.date}</p>
                        <p><strong>Time:</strong> ${data.time}</p>
                    `;
                    
                    const btn = document.createElement('button');
                    btn.className = 'idp-btn';
                    btn.textContent = 'Get IDP';
                    
                    btn.addEventListener('click', () => {
                        // Check if IDP is empty or just spaces
                        if (!data.idp || data.idp.trim() === "") {
                            alert("IDP has not been published yet! Please check back later.");
                        } else {
                            alert("Room Details:\n\n" + data.idp);
                        }
                    });
                    
                    card.appendChild(btn);
                    matchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching matches: ", error);
                matchesContainer.innerHTML = '<p style="text-align: center; color: red;">Failed to load matches.</p>';
            }
        }

        // Fetch Matches for Admin Panel (To update IDP)
        async function fetchAdminMatches() {
            adminMatchesContainer.innerHTML = '<p style="text-align: center;">Loading...</p>';
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminMatchesContainer.innerHTML = '';
                
                if (querySnapshot.empty) {
                    adminMatchesContainer.innerHTML = '<p style="text-align: center;">No matches found.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <p><strong>Date:</strong> ${data.date}</p>
                        <p><strong>Time:</strong> ${data.time}</p>
                        <input type="text" id="idp-input-${docSnap.id}" placeholder="Type IDP here when ready" value="${data.idp || ''}">
                    `;
                    
                    const updateBtn = document.createElement('button');
                    updateBtn.className = 'save-btn';
                    updateBtn.textContent = 'Save IDP';
                    
                    // Logic to update the IDP in the database
                    updateBtn.addEventListener('click', async () => {
                        const newIdp = document.getElementById(`idp-input-${docSnap.id}`).value;
                        updateBtn.textContent = 'Saving...';
                        
                        try {
                            const matchRef = doc(db, "matches", docSnap.id);
                            await updateDoc(matchRef, {
                                idp: newIdp
                            });
                            updateBtn.textContent = 'Saved!';
                            setTimeout(() => { updateBtn.textContent = 'Save IDP'; }, 2000);
                        } catch (error) {
                            console.error("Error updating IDP:", error);
                            updateBtn.textContent = 'Error!';
                            updateBtn.style.background = '#ff4757';
                        }
                    });

                    card.appendChild(updateBtn);
                    adminMatchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching admin matches:", error);
                adminMatchesContainer.innerHTML = '<p style="text-align: center; color: red;">Failed to load.</p>';
            }
        }

        // Load matches on first open
        fetchMatches();
    </script>
</body>
</html>
