<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esports Tournaments</title>
    
    <!-- Google Fonts & HD Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        /* Mobile-First Base Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            padding-bottom: 70px; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h2 { 
            text-align: center; 
            color: #ffd32a; 
            margin: 20px 0 12px; 
            font-size: 20px; 
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase; 
        }
        
        /* Views & View Animations */
        .view { display: none; padding: 12px; max-width: 480px; margin: 0 auto; }
        .view.active { display: block; }

        /* Solid Theme Cards */
        .card { 
            background: #181920; 
            padding: 14px; 
            border-radius: 10px; 
            margin-bottom: 14px; 
            border: 1px solid #2a2b36;
            border-left: 4px solid #ff4757; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); 
        }
        .card p { 
            margin: 6px 0; 
            color: #b2bec3; 
            font-size: 13px; 
            word-break: break-word; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            text-align: left;
        }
        .card strong { color: #ffffff; font-weight: 600; }
        
        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .badge-main { background: #ff4757; color: #fff; }
        .badge-2nd { background: #2ed573; color: #000; }
        
        /* Inputs & Labels */
        label { 
            display: flex; align-items: center; gap: 5px; 
            margin-top: 12px; font-size: 12px; color: #a4b0be; font-weight: 600; 
            text-align: left;
        }
        
        input, select, textarea { 
            width: 100%; padding: 10px 12px; margin: 6px 0 10px 0; 
            border: 1px solid #2a2b36; border-radius: 8px; 
            background: #121318; color: white; 
            font-size: 14px; font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff4757; }
        textarea { resize: vertical; min-height: 60px; }
        
        /* Buttons */
        button { 
            width: 100%; padding: 10px 14px; border: none; border-radius: 8px; 
            font-size: 14px; font-weight: bold; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px;
            cursor: pointer; margin-top: 8px; 
            display: flex; align-items: center; justify-content: center; gap: 6px;
            text-transform: uppercase;
        }
        button .material-symbols-rounded { font-size: 18px; }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background: #ff4757; color: white; }
        .copy-btn { 
            width: auto; padding: 6px 10px; font-size: 12px; margin-top: 0;
            background: rgba(46, 134, 222, 0.15); color: #2e86de; border: 1px solid #2e86de;
            white-space: nowrap; border-radius: 6px;
        }
        .copy-btn:hover { background: #2e86de; color: #fff; }
        
        .save-btn { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; margin-top: 10px; }
        .save-btn:hover { background: #2ed573; color: #000; }

        .delete-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; }
        .delete-btn:hover { background: #ff4757; color: #fff; }

        /* ID & Pass Display Container */
        .idp-box {
            background: #121318; border-radius: 8px; padding: 10px 12px; margin-top: 10px;
            border: 1px solid #2a2b36;
        }
        .idp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
        .idp-row:last-child { margin-bottom: 0; }
        .idp-text { font-size: 13px; word-break: break-all; display: flex; align-items: center; gap: 6px; color: #dfe4ea; text-align: left; }
        .idp-text strong { color: #fff; }
        
        /* Bottom Navigation Bar */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; 
            background: #16171d; 
            display: flex; border-top: 1px solid #2a2b36; z-index: 100; 
        }
        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            cursor: pointer; color: #747d8c; font-size: 11px; font-weight: 600; 
        }
        .nav-item .material-symbols-rounded { font-size: 22px; }
        .nav-item.active { color: #ff4757; }
        .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }
        
        #status-msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 13px; }
        hr { border: 0; height: 1px; background: #2a2b36; margin: 20px 0; }

        /* Loading Spinner */
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; gap: 10px; }
        .loader {
            width: 30px; height: 30px; border: 3px solid rgba(255, 71, 87, 0.2);
            border-top-color: #ff4757; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom; font-size: 20px;">swords</span> Latest Matches</h2>
        <div id="matches-container">
            <div class="loader-container">
                <div class="loader"></div>
                <p style="color: #a4b0be; font-size: 13px;">Syncing data...</p>
            </div>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="view">
        <!-- Login Section -->
        <div id="admin-login-section">
            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom; font-size: 20px;">admin_panel_settings</span> Admin Login</h2>
            <div class="card">
                <label><span class="material-symbols-rounded" style="font-size: 16px;">lock</span> Authentication Required</label>
                <input type="password" id="admin-pass" placeholder="Enter Admin Password">
                <button id="login-btn" class="btn-primary">
                    <span class="material-symbols-rounded">login</span> Login
                </button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="admin-dashboard-section" style="display: none;">
            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom; font-size: 20px;">add_circle</span> Publish Match</h2>
            <div class="card">
                <label><span class="material-symbols-rounded" style="font-size: 16px;">emoji_events</span> Tournament Name:</label>
                <input type="text" id="match-tournament" placeholder="e.g. Free Fire Battle Royale">

                <label><span class="material-symbols-rounded" style="font-size: 16px;">groups</span> Select Lineup:</label>
                <select id="match-lineup">
                    <option value="MAIN LINEUP">MAIN LINEUP</option>
                    <option value="2ND LINEUP">2ND LINEUP</option>
                </select>

                <label><span class="material-symbols-rounded" style="font-size: 16px;">description</span> Description:</label>
                <textarea id="match-description" placeholder="e.g. Map: Bermuda, Rules: No teaming"></textarea>
                
                <label><span class="material-symbols-rounded" style="font-size: 16px;">schedule</span> Match Time:</label>
                <input type="text" id="match-time" placeholder="e.g. 9:00 PM">
                
                <button id="publish-btn" class="btn-primary">
                    <span class="material-symbols-rounded">campaign</span> Publish Match
                </button>
                <p id="status-msg"></p>
            </div>

            <hr>

            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom; font-size: 20px;">settings</span> Manage Matches</h2>
            <p style="text-align: center; color: #a4b0be; font-size: 12px; margin-bottom: 15px;">Add Room ID & Password or delete matches below.</p>
            <div id="admin-matches-container">
                <!-- Admin matches load here -->
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home">
            <span class="material-symbols-rounded">home</span>
            HOME
        </div>
        <div class="nav-item" id="nav-admin">
            <span class="material-symbols-rounded">shield_person</span>
            ADMIN
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase Configuration (Intact)
        const firebaseConfig = {
            apiKey: "AIzaSyACC6nAbAb96Aw5NAe-C2aTZ8-gtOsnYzE",
            authDomain: "survivors-b9c6d.firebaseapp.com",
            projectId: "survivors-b9c6d",
            storageBucket: "survivors-b9c6d.firebasestorage.app",
            messagingSenderId: "289481978081",
            appId: "1:289481978081:web:68e424068ff9d056d607a0",
            measurementId: "G-1XRC9SCV59"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // UI Elements
        const homeView = document.getElementById('home-view');
        const adminView = document.getElementById('admin-view');
        const navHome = document.getElementById('nav-home');
        const navAdmin = document.getElementById('nav-admin');
        const matchesContainer = document.getElementById('matches-container');
        const adminMatchesContainer = document.getElementById('admin-matches-container');

        let isAdminLoggedIn = false;
        
        const loaderHTML = `<div class="loader-container"><div class="loader"></div><p style="color: #a4b0be; font-size: 13px;">Syncing data...</p></div>`;

        // Navigation Switcher
        navHome.addEventListener('click', () => {
            homeView.classList.add('active');
            adminView.classList.remove('active');
            navHome.classList.add('active');
            navAdmin.classList.remove('active');
            fetchMatches();
        });

        navAdmin.addEventListener('click', () => {
            adminView.classList.add('active');
            homeView.classList.remove('active');
            navAdmin.classList.add('active');
            navHome.classList.remove('active');
            if (isAdminLoggedIn) {
                fetchAdminMatches();
            }
        });

        // Admin Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "srv1122") { 
                isAdminLoggedIn = true;
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-dashboard-section').style.display = 'block';
                fetchAdminMatches();
            } else {
                alert("Incorrect Password!");
            }
        });

        // Publish Match
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const tournament = document.getElementById('match-tournament').value.trim();
            const lineup = document.getElementById('match-lineup').value;
            const description = document.getElementById('match-description').value.trim();
            const time = document.getElementById('match-time').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!tournament || !time) {
                statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle; font-size: 16px;">error</span> Please fill in Tournament Name and Time.';
                statusMsg.style.color = "#ff4757";
                return;
            }

            statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle; font-size: 16px;">sync</span> Publishing...';
            statusMsg.style.color = "#ffd32a";

            try {
                await addDoc(collection(db, "matches"), {
                    tournament: tournament,
                    lineup: lineup,
                    description: description || "No description provided.",
                    time: time,
                    roomId: "", 
                    roomPass: "",
                    createdAt: serverTimestamp()
                });
                
                statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle; font-size: 16px;">check_circle</span> Match Published Successfully!';
                statusMsg.style.color = "#2ed573";
                
                document.getElementById('match-tournament').value = '';
                document.getElementById('match-description').value = '';
                document.getElementById('match-time').value = '';

                fetchAdminMatches();
                setTimeout(() => statusMsg.textContent = "", 3000);
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMsg.textContent = "Error publishing match.";
                statusMsg.style.color = "#ff4757";
            }
        });

        // Helper for Clipboard Copying
        window.copyToClipboard = function(text, btnElement) {
            if (!text) {
                alert("Nothing to copy!");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '<span class="material-symbols-rounded" style="font-size: 14px;">check</span> Copied!';
                btnElement.style.background = "#2ed573";
                btnElement.style.color = "#000";
                btnElement.style.borderColor = "#2ed573";
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.background = "";
                    btnElement.style.color = "";
                    btnElement.style.borderColor = "";
                }, 2000);
            }).catch(err => {
                console.error('Copy failed', err);
            });
        };

        // Fetch Matches for Home View
        async function fetchMatches() {
            matchesContainer.innerHTML = loaderHTML;
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                matchesContainer.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    matchesContainer.innerHTML = '<div class="loader-container"><span class="material-symbols-rounded" style="font-size: 32px; color:#a4b0be">inbox</span><p style="color: #a4b0be; font-size: 13px;">No matches published yet.</p></div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const badgeClass = data.lineup === 'MAIN LINEUP' ? 'badge-main' : 'badge-2nd';
                    const iconType = data.lineup === 'MAIN LINEUP' ? 'verified' : 'military_tech';
                    
                    const hasRoomDetails = (data.roomId && data.roomId.trim() !== "") || (data.roomPass && data.roomPass.trim() !== "");

                    let roomSectionHtml = '';
                    if (hasRoomDetails) {
                        roomSectionHtml = `
                            <div class="idp-box">
                                <div class="idp-row">
                                    <span class="idp-text"><span class="material-symbols-rounded" style="font-size: 16px;">tag</span> <strong>ID:</strong> ${data.roomId || 'N/A'}</span>
                                    ${data.roomId ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomId}', this)"><span class="material-symbols-rounded" style="font-size: 14px;">content_copy</span> Copy ID</button>` : ''}
                                </div>
                                <div class="idp-row">
                                    <span class="idp-text"><span class="material-symbols-rounded" style="font-size: 16px;">key</span> <strong>Pass:</strong> ${data.roomPass || 'N/A'}</span>
                                    ${data.roomPass ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomPass}', this)"><span class="material-symbols-rounded" style="font-size: 14px;">content_copy</span> Copy Pass</button>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        roomSectionHtml = `
                            <div class="idp-box" style="text-align: center; color: #ffd32a; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                                <span class="material-symbols-rounded" style="font-size: 18px;">hourglass_empty</span>
                                Room ID & Password will be available here soon.
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <span class="badge ${badgeClass}"><span class="material-symbols-rounded" style="font-size: 14px;">${iconType}</span> ${data.lineup || 'MAIN LINEUP'}</span>
                        <p style="font-size: 16px; font-weight: bold; color: #fff; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">${data.tournament || 'Tournament'}</p>
                        <p><span class="material-symbols-rounded" style="color: #ff4757; font-size: 16px;">schedule</span> <strong>Time:</strong> ${data.time}</p>
                        <p><span class="material-symbols-rounded" style="color: #2ed573; font-size: 16px;">info</span> <strong>Rules:</strong> ${data.description}</p>
                        ${roomSectionHtml}
                    `;
                    
                    matchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching matches: ", error);
                matchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757; margin-top: 20px; font-size: 13px;"><span class="material-symbols-rounded" style="font-size: 16px;">error</span> Failed to load matches.</p>';
            }
        }

        // Fetch Matches for Admin Dashboard
        async function fetchAdminMatches() {
            adminMatchesContainer.innerHTML = loaderHTML;
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminMatchesContainer.innerHTML = '';
                
                if (querySnapshot.empty) {
                    adminMatchesContainer.innerHTML = '<div class="loader-container"><span class="material-symbols-rounded" style="font-size: 32px; color:#a4b0be">inbox</span><p style="color: #a4b0be; font-size: 13px;">No matches found.</p></div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <p style="font-size: 15px; font-weight: bold; color: #ffd32a; font-family: 'Rajdhani', sans-serif; text-transform: uppercase;">${data.tournament || 'N/A'} <span style="font-size: 12px; color: #a4b0be;">(${data.lineup || 'MAIN LINEUP'})</span></p>
                        <p><span class="material-symbols-rounded" style="font-size: 15px;">schedule</span> <strong>Time:</strong> ${data.time}</p>
                        <p><span class="material-symbols-rounded" style="font-size: 15px;">description</span> <strong>Desc:</strong> ${data.description}</p>
                        
                        <label><span class="material-symbols-rounded" style="font-size: 14px;">tag</span> Room ID:</label>
                        <input type="text" id="room-id-${docSnap.id}" placeholder="Enter Room ID" value="${data.roomId || ''}">
                        
                        <label><span class="material-symbols-rounded" style="font-size: 14px;">key</span> Room Password:</label>
                        <input type="text" id="room-pass-${docSnap.id}" placeholder="Enter Password" value="${data.roomPass || ''}">
                    `;
                    
                    const updateBtn = document.createElement('button');
                    updateBtn.className = 'save-btn';
                    updateBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">save</span> Save Details';
                    
                    updateBtn.addEventListener('click', async () => {
                        const newRoomId = document.getElementById(`room-id-${docSnap.id}`).value.trim();
                        const newRoomPass = document.getElementById(`room-pass-${docSnap.id}`).value.trim();
                        
                        updateBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">sync</span> Saving...';
                        
                        try {
                            const matchRef = doc(db, "matches", docSnap.id);
                            await updateDoc(matchRef, {
                                roomId: newRoomId,
                                roomPass: newRoomPass
                            });
                            updateBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">check</span> Saved!';
                            updateBtn.style.background = '#2ed573';
                            updateBtn.style.color = '#000';
                            setTimeout(() => { 
                                updateBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">save</span> Save Details'; 
                                updateBtn.style.background = '';
                                updateBtn.style.color = '';
                            }, 2000);
                        } catch (error) {
                            console.error("Error updating details:", error);
                            updateBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">error</span> Error!';
                            updateBtn.style.background = '#ff4757';
                            updateBtn.style.color = '#fff';
                        }
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">delete</span> Delete Match';

                    deleteBtn.addEventListener('click', async () => {
                        if (confirm("Are you sure you want to delete this match?")) {
                            deleteBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">sync</span> Deleting...';
                            try {
                                const matchRef = doc(db, "matches", docSnap.id);
                                await deleteDoc(matchRef);
                                fetchAdminMatches();
                            } catch (error) {
                                console.error("Error deleting match:", error);
                                deleteBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 16px;">error</span> Error';
                            }
                        }
                    });

                    card.appendChild(updateBtn);
                    card.appendChild(deleteBtn);
                    adminMatchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching admin matches:", error);
                adminMatchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757; margin-top: 20px; font-size: 13px;"><span class="material-symbols-rounded" style="font-size: 16px;">error</span> Failed to load.</p>';
            }
        }

        // Initial Load
        fetchMatches();
    </script>
</body>
</html>
