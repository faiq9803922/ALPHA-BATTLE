<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esports Tournaments</title>
    
    <!-- Google Fonts & HD Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        /* Mobile-First Base Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0c10; 
            color: #ffffff; 
            padding-bottom: 80px; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- LIVE ANIMATED BACKGROUND --- */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #0b0c10;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out alternate;
            will-change: transform;
        }
        .orb:nth-child(1) { width: 300px; height: 300px; background: #ff4757; top: -10%; left: -10%; animation-delay: 0s; }
        .orb:nth-child(2) { width: 400px; height: 400px; background: #2e86de; bottom: -20%; right: -10%; animation-duration: 25s; }
        .orb:nth-child(3) { width: 250px; height: 250px; background: #9b59b6; top: 40%; left: 40%; animation-duration: 22s; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 100px) scale(1.2); }
        }

        h2 { 
            text-align: center; 
            color: #ffeb3b; 
            margin: 25px 0 15px; 
            font-size: 26px; 
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase; 
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.3);
        }
        
        /* Views & View Animations */
        .view { display: none; padding: 15px; max-width: 500px; margin: 0 auto; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
        .view.active { display: block; opacity: 1; transform: translateY(0); animation: fadeInUp 0.4s ease forwards; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Cards */
        .card { 
            background: rgba(30, 30, 30, 0.4); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 5px solid #ff4757; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .card p { margin: 8px 0; color: #dcdde1; font-size: 15px; word-break: break-word; display: flex; align-items: center; gap: 8px; }
        .card strong { color: #ffffff; }
        
        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase; margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .badge-main { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; }
        .badge-2nd { background: linear-gradient(135deg, #2ed573, #7bed9f); color: #000; }
        
        /* Inputs & Labels */
        label { display: flex; align-items: center; gap: 6px; margin-top: 15px; font-size: 14px; color: #a4b0be; font-weight: 600; }
        
        input, select, textarea { 
            width: 100%; padding: 14px; margin: 8px 0 12px 0; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; 
            background: rgba(0,0,0,0.3); color: white; 
            font-size: 16px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff4757; background: rgba(0,0,0,0.5); box-shadow: 0 0 10px rgba(255,71,87,0.2); }
        textarea { resize: vertical; min-height: 80px; }
        
        /* Buttons with Icons */
        button { 
            width: 100%; padding: 14px; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s ease; margin-top: 10px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-transform: uppercase;
        }
        button .material-symbols-rounded { font-size: 20px; }
        button:active { transform: scale(0.96); }
        
        .btn-primary { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6); }

        .copy-btn { 
            width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0;
            background: rgba(46, 134, 222, 0.2); color: #2e86de; border: 1px solid #2e86de;
            white-space: nowrap; border-radius: 8px;
        }
        .copy-btn:hover { background: #2e86de; color: #fff; }
        
        .save-btn { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; margin-top: 15px; }
        .save-btn:hover { background: #2ed573; color: #000; }

        .delete-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; }
        .delete-btn:hover { background: #ff4757; color: #fff; }

        /* ID & Pass Display Container */
        .idp-box {
            background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 15px; margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .idp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
        .idp-row:last-child { margin-bottom: 0; }
        .idp-text { font-size: 15px; word-break: break-all; display: flex; align-items: center; gap: 8px; color: #dfe4ea; }
        .idp-text strong { color: #fff; }
        
        /* Bottom Navigation Glassmorphism */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; 
            background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; border-top: 1px solid rgba(255,255,255,0.08); z-index: 100; 
        }
        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            cursor: pointer; color: #747d8c; font-size: 12px; font-weight: 600; transition: 0.3s; 
        }
        .nav-item .material-symbols-rounded { font-size: 26px; transition: 0.3s; }
        .nav-item.active { color: #ff4757; }
        .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; transform: translateY(-2px); text-shadow: 0 0 10px rgba(255,71,87,0.5); }
        
        #status-msg { text-align: center; margin-top: 12px; font-weight: bold; font-size: 14px; transition: 0.3s; }
        hr { border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 30px 0; }

        /* Loading Spinner */
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; gap: 15px; }
        .loader {
            width: 40px; height: 40px; border: 4px solid rgba(255, 71, 87, 0.2);
            border-top-color: #ff4757; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- LIVE BACKGROUND -->
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- HOME VIEW -->
    <div id="home-view" class="view active">
        <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom;">swords</span> LATEST MATCHES</h2>
        <div id="matches-container">
            <div class="loader-container">
                <div class="loader"></div>
                <p style="color: #a4b0be;">Syncing data...</p>
            </div>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="view">
        <!-- Login Section -->
        <div id="admin-login-section">
            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom;">admin_panel_settings</span> ADMIN LOGIN</h2>
            <div class="card">
                <label><span class="material-symbols-rounded">lock</span> Authentication Required</label>
                <input type="password" id="admin-pass" placeholder="Enter Admin Password">
                <button id="login-btn" class="btn-primary">
                    <span class="material-symbols-rounded">login</span> Login
                </button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="admin-dashboard-section" style="display: none;">
            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom;">add_circle</span> PUBLISH NEW MATCH</h2>
            <div class="card">
                <label><span class="material-symbols-rounded">emoji_events</span> Tournament Name:</label>
                <input type="text" id="match-tournament" placeholder="e.g. Free Fire Battle Royale">

                <label><span class="material-symbols-rounded">groups</span> Select Lineup:</label>
                <select id="match-lineup">
                    <option value="MAIN LINEUP">MAIN LINEUP</option>
                    <option value="2ND LINEUP">2ND LINEUP</option>
                </select>

                <label><span class="material-symbols-rounded">description</span> Description:</label>
                <textarea id="match-description" placeholder="e.g. Map: Bermuda, Rules: No teaming"></textarea>
                
                <label><span class="material-symbols-rounded">schedule</span> Match Time:</label>
                <input type="text" id="match-time" placeholder="e.g. 9:00 PM">
                
                <button id="publish-btn" class="btn-primary">
                    <span class="material-symbols-rounded">campaign</span> Publish Match
                </button>
                <p id="status-msg"></p>
            </div>

            <hr>

            <h2><span class="material-symbols-rounded" style="vertical-align: text-bottom;">settings</span> MANAGE MATCHES</h2>
            <p style="text-align: center; color: #a4b0be; font-size: 13px; margin-bottom: 20px;">Add Room ID & Password or delete matches below.</p>
            <div id="admin-matches-container">
                <!-- Admin matches load here -->
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home">
            <span class="material-symbols-rounded">home</span>
            HOME
        </div>
        <div class="nav-item" id="nav-admin">
            <span class="material-symbols-rounded">shield_person</span>
            ADMIN
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase Configuration (Intact)
        const firebaseConfig = {
            apiKey: "AIzaSyACC6nAbAb96Aw5NAe-C2aTZ8-gtOsnYzE",
            authDomain: "survivors-b9c6d.firebaseapp.com",
            projectId: "survivors-b9c6d",
            storageBucket: "survivors-b9c6d.firebasestorage.app",
            messagingSenderId: "289481978081",
            appId: "1:289481978081:web:68e424068ff9d056d607a0",
            measurementId: "G-1XRC9SCV59"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // UI Elements
        const homeView = document.getElementById('home-view');
        const adminView = document.getElementById('admin-view');
        const navHome = document.getElementById('nav-home');
        const navAdmin = document.getElementById('nav-admin');
        const matchesContainer = document.getElementById('matches-container');
        const adminMatchesContainer = document.getElementById('admin-matches-container');

        let isAdminLoggedIn = false;
        
        const loaderHTML = `<div class="loader-container"><div class="loader"></div><p style="color: #a4b0be;">Syncing data...</p></div>`;

        // Navigation Switcher
        navHome.addEventListener('click', () => {
            homeView.classList.add('active');
            adminView.classList.remove('active');
            navHome.classList.add('active');
            navAdmin.classList.remove('active');
            fetchMatches();
        });

        navAdmin.addEventListener('click', () => {
            adminView.classList.add('active');
            homeView.classList.remove('active');
            navAdmin.classList.add('active');
            navHome.classList.remove('active');
            if (isAdminLoggedIn) {
                fetchAdminMatches();
            }
        });

        // Admin Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "srv1122") { 
                isAdminLoggedIn = true;
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-dashboard-section').style.display = 'block';
                fetchAdminMatches();
            } else {
                alert("Incorrect Password!");
            }
        });

        // Publish Match
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const tournament = document.getElementById('match-tournament').value.trim();
            const lineup = document.getElementById('match-lineup').value;
            const description = document.getElementById('match-description').value.trim();
            const time = document.getElementById('match-time').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!tournament || !time) {
                statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle;">error</span> Please fill in Tournament Name and Time.';
                statusMsg.style.color = "#ff4757";
                return;
            }

            statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle;">sync</span> Publishing...';
            statusMsg.style.color = "#ffeb3b";

            try {
                await addDoc(collection(db, "matches"), {
                    tournament: tournament,
                    lineup: lineup,
                    description: description || "No description provided.",
                    time: time,
                    roomId: "", 
                    roomPass: "",
                    createdAt: serverTimestamp()
                });
                
                statusMsg.innerHTML = '<span class="material-symbols-rounded" style="vertical-align: middle;">check_circle</span> Match Published Successfully!';
                statusMsg.style.color = "#2ed573";
                
                document.getElementById('match-tournament').value = '';
                document.getElementById('match-description').value = '';
                document.getElementById('match-time').value = '';

                fetchAdminMatches();
                setTimeout(() => statusMsg.textContent = "", 3000);
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMsg.textContent = "Error publishing match.";
                statusMsg.style.color = "#ff4757";
            }
        });

        // Helper for Clipboard Copying
        window.copyToClipboard = function(text, btnElement) {
            if (!text) {
                alert("Nothing to copy!");
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '<span class="material-symbols-rounded">check</span> Copied!';
                btnElement.style.background = "#2ed573";
                btnElement.style.color = "#000";
                btnElement.style.borderColor = "#2ed573";
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.background = "";
                    btnElement.style.color = "";
                    btnElement.style.borderColor = "";
                }, 2000);
            }).catch(err => {
                console.error('Copy failed', err);
            });
        };

        // Fetch Matches for Home View
        async function fetchMatches() {
            matchesContainer.innerHTML = loaderHTML;
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                matchesContainer.innerHTML = ''; 
                
                if (querySnapshot.empty) {
                    matchesContainer.innerHTML = '<div class="loader-container"><span class="material-symbols-rounded" style="font-size: 40px; color:#a4b0be">inbox</span><p style="color: #a4b0be;">No matches published yet.</p></div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const badgeClass = data.lineup === 'MAIN LINEUP' ? 'badge-main' : 'badge-2nd';
                    const iconType = data.lineup === 'MAIN LINEUP' ? 'verified' : 'military_tech';
                    
                    const hasRoomDetails = (data.roomId && data.roomId.trim() !== "") || (data.roomPass && data.roomPass.trim() !== "");

                    let roomSectionHtml = '';
                    if (hasRoomDetails) {
                        roomSectionHtml = `
                            <div class="idp-box">
                                <div class="idp-row">
                                    <span class="idp-text"><span class="material-symbols-rounded">tag</span> <strong>ID:</strong> ${data.roomId || 'N/A'}</span>
                                    ${data.roomId ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomId}', this)"><span class="material-symbols-rounded">content_copy</span> Copy ID</button>` : ''}
                                </div>
                                <div class="idp-row">
                                    <span class="idp-text"><span class="material-symbols-rounded">key</span> <strong>Pass:</strong> ${data.roomPass || 'N/A'}</span>
                                    ${data.roomPass ? `<button class="copy-btn" onclick="copyToClipboard('${data.roomPass}', this)"><span class="material-symbols-rounded">content_copy</span> Copy Pass</button>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        roomSectionHtml = `
                            <div class="idp-box" style="text-align: center; color: #ffeb3b; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                                <span class="material-symbols-rounded">hourglass_empty</span>
                                Room ID & Password will be available here soon.
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <span class="badge ${badgeClass}"><span class="material-symbols-rounded" style="font-size: 16px;">${iconType}</span> ${data.lineup || 'MAIN LINEUP'}</span>
                        <p style="font-size: 20px; font-weight: bold; color: #fff; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; text-transform: uppercase;">${data.tournament || 'Tournament'}</p>
                        <p><span class="material-symbols-rounded" style="color: #ff4757;">schedule</span> <strong>Time:</strong> ${data.time}</p>
                        <p><span class="material-symbols-rounded" style="color: #2ed573;">info</span> <strong>Rules:</strong> ${data.description}</p>
                        ${roomSectionHtml}
                    `;
                    
                    matchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching matches: ", error);
                matchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757; margin-top: 20px;"><span class="material-symbols-rounded">error</span> Failed to load matches.</p>';
            }
        }

        // Fetch Matches for Admin Dashboard
        async function fetchAdminMatches() {
            adminMatchesContainer.innerHTML = loaderHTML;
            try {
                const q = query(collection(db, "matches"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminMatchesContainer.innerHTML = '';
                
                if (querySnapshot.empty) {
                    adminMatchesContainer.innerHTML = '<div class="loader-container"><span class="material-symbols-rounded" style="font-size: 40px; color:#a4b0be">inbox</span><p style="color: #a4b0be;">No matches found.</p></div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <p style="font-size: 18px; font-weight: bold; color: #ffeb3b; font-family: 'Rajdhani', sans-serif; text-transform: uppercase;">${data.tournament || 'N/A'} <span style="font-size: 14px; color: #a4b0be;">(${data.lineup || 'MAIN LINEUP'})</span></p>
                        <p><span class="material-symbols-rounded" style="font-size:18px;">schedule</span> <strong>Time:</strong> ${data.time}</p>
                        <p><span class="material-symbols-rounded" style="font-size:18px;">description</span> <strong>Desc:</strong> ${data.description}</p>
                        
                        <label><span class="material-symbols-rounded">tag</span> Room ID:</label>
                        <input type="text" id="room-id-${docSnap.id}" placeholder="Enter Room ID" value="${data.roomId || ''}">
                        
                        <label><span class="material-symbols-rounded">key</span> Room Password:</label>
                        <input type="text" id="room-pass-${docSnap.id}" placeholder="Enter Password" value="${data.roomPass || ''}">
                    `;
                    
                    const updateBtn = document.createElement('button');
                    updateBtn.className = 'save-btn';
                    updateBtn.innerHTML = '<span class="material-symbols-rounded">save</span> Save Details';
                    
                    updateBtn.addEventListener('click', async () => {
                        const newRoomId = document.getElementById(`room-id-${docSnap.id}`).value.trim();
                        const newRoomPass = document.getElementById(`room-pass-${docSnap.id}`).value.trim();
                        
                        updateBtn.innerHTML = '<span class="material-symbols-rounded">sync</span> Saving...';
                        
                        try {
                            const matchRef = doc(db, "matches", docSnap.id);
                            await updateDoc(matchRef, {
                                roomId: newRoomId,
                                roomPass: newRoomPass
                            });
                            updateBtn.innerHTML = '<span class="material-symbols-rounded">check</span> Saved!';
                            updateBtn.style.background = '#2ed573';
                            updateBtn.style.color = '#000';
                            setTimeout(() => { 
                                updateBtn.innerHTML = '<span class="material-symbols-rounded">save</span> Save Details'; 
                                updateBtn.style.background = '';
                                updateBtn.style.color = '';
                            }, 2000);
                        } catch (error) {
                            console.error("Error updating details:", error);
                            updateBtn.innerHTML = '<span class="material-symbols-rounded">error</span> Error!';
                            updateBtn.style.background = '#ff4757';
                            updateBtn.style.color = '#fff';
                        }
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '<span class="material-symbols-rounded">delete</span> Delete Match';

                    deleteBtn.addEventListener('click', async () => {
                        if (confirm("Are you sure you want to delete this match?")) {
                            deleteBtn.innerHTML = '<span class="material-symbols-rounded">sync</span> Deleting...';
                            try {
                                const matchRef = doc(db, "matches", docSnap.id);
                                await deleteDoc(matchRef);
                                fetchAdminMatches();
                            } catch (error) {
                                console.error("Error deleting match:", error);
                                deleteBtn.innerHTML = '<span class="material-symbols-rounded">error</span> Error';
                            }
                        }
                    });

                    card.appendChild(updateBtn);
                    card.appendChild(deleteBtn);
                    adminMatchesContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching admin matches:", error);
                adminMatchesContainer.innerHTML = '<p style="text-align: center; color: #ff4757; margin-top: 20px;"><span class="material-symbols-rounded">error</span> Failed to load.</p>';
            }
        }

        // Initial Load
        fetchMatches();
    </script>
</body>
</html>
